name: build-macos

# OCIO GDExtension for macOS — universal (arm64 + x86_64) binaries with the
# Homebrew OpenColorIO/OpenImageIO dylibs bundled and rewritten to @rpath,
# so the addon folder is portable (no Homebrew needed on the user machine).
#
# Produces the dist/ocio/macos artifact:
#   libgdocio.macos.template_{debug,release}.universal.dylib
#   libOpenColorIO/OpenImageIO/... .dylib (universal, @rpath)
#   ocio.gdextension (ready to use) + dependencies-snippet.txt
# Copy it into <project>/addons/ocio/macos/ to consume.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocio-macos-universal:
    name: OCIO universal (arm64 + x86_64)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (with godot-cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native (arm64) build dependencies
        run: brew install scons pkg-config opencolorio openimageio

      - name: Install Rosetta + x86_64 Homebrew
        env:
          NONINTERACTIVE: 1
        run: |
          softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install x86_64 build dependencies
        run: arch -x86_64 /usr/local/bin/brew install pkg-config opencolorio openimageio

      - name: Build (debug + release, arm64 + x86_64)
        run: |
          cd ocio
          for target in template_debug template_release; do
            # arm64: native Homebrew (/opt/homebrew)
            scons platform=macos arch=arm64 target=$target install=0 rpath=0
            # x86_64: cross-compile with Apple clang, link against the Intel
            # Homebrew (/usr/local) — its pkg-config must come first on PATH.
            PATH="/usr/local/bin:$PATH" scons platform=macos arch=x86_64 target=$target install=0 rpath=0
          done

      - name: Stage per-arch bundles
        run: |
          for target in template_debug template_release; do
            ocio/tools/macos-bundle.sh stage \
              ocio/libgdocio.macos.$target.arm64.dylib \
              build/stage/arm64/$target
            ocio/tools/macos-bundle.sh stage \
              ocio/libgdocio.macos.$target.x86_64.dylib \
              build/stage/x86_64/$target
          done

      - name: Merge universal binaries + codesign
        run: |
          for target in template_debug template_release; do
            ocio/tools/macos-bundle.sh merge $target \
              build/stage/arm64/$target \
              build/stage/x86_64/$target \
              dist/ocio/macos
          done

      - name: Verify bundle
        run: |
          set -euo pipefail
          ls -la dist/ocio/macos
          for lib in dist/ocio/macos/*.dylib; do
            echo "== $lib"
            lipo -archs "$lib"
          done
          # Every non-system reference must be @rpath (fully relocated).
          bad=$(otool -L dist/ocio/macos/*.dylib | awk '{ print $1 }' \
            | grep -v -e '^@rpath' -e '^/usr/lib' -e '/System/' -e ':' || true)
          if [ -n "$bad" ]; then
            echo "unrelocated references:"; echo "$bad"; exit 1
          fi
          # The release library must dlopen standalone: proves every
          # dependency is bundled and correctly rewritten.
          python3 - <<'PY'
          import ctypes
          ctypes.CDLL("dist/ocio/macos/libgdocio.macos.template_release.universal.dylib")
          print("dlopen OK")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocio-macos-universal
          path: dist/ocio/macos/
          if-no-files-found: error
