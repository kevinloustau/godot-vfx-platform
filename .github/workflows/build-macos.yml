name: build-macos

# OCIO GDExtension for macOS — universal (arm64 + x86_64) binaries with the
# OpenColorIO/OpenImageIO dylibs bundled and rewritten to @rpath, so the
# addon folder is portable (nothing to install on the user machine).
#
# Dependencies come from conda-forge (micromamba) for BOTH arches: Homebrew
# no longer installs/builds x86_64 macOS packages, while conda-forge ships
# matching osx-arm64 and osx-64 builds of the same versions. The x86_64 env
# is never executed — Apple clang cross-compiles with -arch x86_64 — so no
# Rosetta is involved.
#
# Produces the dist/ocio/macos artifact:
#   libgdocio.macos.template_{debug,release}.universal.dylib
#   libOpenColorIO/OpenImageIO/... .dylib (universal, @rpath)
#   ocio.gdextension (ready to use) + dependencies-snippet.txt
# Copy it into <project>/addons/ocio/macos/ to consume.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocio-macos-universal:
    name: OCIO universal (arm64 + x86_64)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      OCIO_VERSION: "2.6.0"
      OIIO_VERSION: "3.2.1.2"
    steps:
      - name: Checkout (with godot-cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools (Homebrew, arm64)
        run: brew install scons pkg-config

      - name: Install OpenColorIO/OpenImageIO from conda-forge (osx-arm64 + osx-64)
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/osx-arm64/latest | tar -xj -C "$RUNNER_TEMP" bin/micromamba
          MM="$RUNNER_TEMP/bin/micromamba"
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba"
          # fmt: OIIO headers #include <fmt/format.h> but libopenimageio does
          # not run-depend on it (conda-forge feedstock ignores its run export)
          CONDA_SUBDIR=osx-arm64 "$MM" create -y -p "$RUNNER_TEMP/env-arm64" -c conda-forge \
            "libopencolorio=$OCIO_VERSION" "libopenimageio=$OIIO_VERSION" fmt
          CONDA_SUBDIR=osx-64 "$MM" create -y -p "$RUNNER_TEMP/env-x86_64" -c conda-forge \
            "libopencolorio=$OCIO_VERSION" "libopenimageio=$OIIO_VERSION" fmt

      - name: Build (debug + release, arm64 + x86_64)
        run: |
          cd ocio
          for target in template_debug template_release; do
            PKG_CONFIG_PATH="$RUNNER_TEMP/env-arm64/lib/pkgconfig" \
              scons platform=macos arch=arm64 target=$target install=0 rpath=0
            PKG_CONFIG_PATH="$RUNNER_TEMP/env-x86_64/lib/pkgconfig" \
              scons platform=macos arch=x86_64 target=$target install=0 rpath=0
          done

      - name: Stage per-arch bundles
        run: |
          for target in template_debug template_release; do
            ocio/tools/macos-bundle.sh stage \
              ocio/libgdocio.macos.$target.arm64.dylib \
              "$RUNNER_TEMP/env-arm64/lib" \
              build/stage/arm64/$target
            ocio/tools/macos-bundle.sh stage \
              ocio/libgdocio.macos.$target.x86_64.dylib \
              "$RUNNER_TEMP/env-x86_64/lib" \
              build/stage/x86_64/$target
          done

      - name: Merge universal binaries + codesign
        run: |
          for target in template_debug template_release; do
            ocio/tools/macos-bundle.sh merge $target \
              build/stage/arm64/$target \
              build/stage/x86_64/$target \
              dist/ocio/macos
          done

      - name: Verify bundle
        run: |
          set -euo pipefail
          ls -la dist/ocio/macos
          for lib in dist/ocio/macos/*.dylib; do
            echo "== $lib"
            lipo -archs "$lib"
          done
          # Every non-system reference must be @rpath (fully relocated).
          # otool indents the actual references with a tab; its "<file>"
          # headers and the blank lines between files are not references.
          bad=$(otool -L dist/ocio/macos/*.dylib | awk '/^\t/ { print $1 }' \
            | grep -v -e '^@rpath' -e '^/usr/lib' -e '/System/' || true)
          if [ -n "$bad" ]; then
            echo "unrelocated references:"; echo "$bad"; exit 1
          fi
          echo "all $(ls dist/ocio/macos/*.dylib | wc -l | tr -d ' ') dylibs are universal with @rpath references"
          du -sh dist/ocio/macos
          # Godot preloads the [dependencies] before the main library; mimic
          # that, then dlopen the release build standalone.
          python3 - <<'PY'
          import ctypes, glob
          for f in sorted(glob.glob("dist/ocio/macos/*.dylib")):
              if "libgdocio" in f:
                  continue
              ctypes.CDLL(f)
          ctypes.CDLL("dist/ocio/macos/libgdocio.macos.template_release.universal.dylib")
          print("dlopen OK")
          PY

      - name: Upload artifact
        if: always()  # keep the binaries downloadable even if verify fails
        uses: actions/upload-artifact@v4
        with:
          name: ocio-macos-universal
          path: dist/ocio/macos/
          if-no-files-found: warn
